name: Verify isolated add-in removal

on:
  push:
    branches: [feat/remove-portfolio-scan-isolated-20261019]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m py_compile api.py
      - name: Check Excel function JavaScript syntax
        run: node --check excel/functions.js
      - name: Validate custom functions metadata
        run: python -m json.tool excel/functions.json > /dev/null
      - name: Check removal across source, website and docs
        run: python -m unittest discover -s tests -p 'test_portfolio_scan_removed.py' -v
