            exit 1
          fi
          python lab/phase1_independent_evidence_requirements.py | tee stage.log
      - name: Retain non-sensitive stage summary
        if: always()
        shell: bash
        run: |
          echo '### evidence-worklist (execution status, not institutional approval)' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $LAB_PIPELINE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f stage.log ]; then
            cat stage.log >> "$GITHUB_STEP_SUMMARY"
          fi
  release-assessment:
