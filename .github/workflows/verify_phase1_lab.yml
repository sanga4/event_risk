name: Verify EventRisk Phase I laboratory API
on:
  push:
    branches:
      - feat/phase1-hac-holdout-production-gates-20261023
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lab-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned laboratory runtime and offline-test dependencies
        run: pip install -r lab/requirements.txt httpx==0.27.2
      - name: Compile all laboratory scripts without database or secrets
        run: python -m py_compile lab/api.py lab/phase1_build_v3.py lab/phase1_historical_regressions.py lab/phase1_robust_regressions.py lab/phase1_release_gates.py
      - name: Validate API, robust regression math, data rights and research-mode gates
        run: python -m unittest discover -s tests -p 'test_lab_*.py' -v
