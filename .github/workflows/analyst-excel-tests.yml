name: Analyst Excel isolated tests
on:
  push:
    branches:
      - 'feat/er-excel-seven-formulas-isolated-*'
  workflow_dispatch:
jobs:
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
