name: Analyst Excel isolated tests
on:
  push:
    branches:
      - 'feat/er-excel-seven-formulas-isolated-*'
  workflow_dispatch:
jobs:
  excel-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  live-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing production API (may fail while MotherDuck trial is suspended)
        run: node excel/tests/live-upstream-smoke.mjs
