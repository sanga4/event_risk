name: Factor Lab prospective public-market capture
on:
  workflow_dispatch:
    # Hourly scheduling can be enabled once a scoped MOTHERDUCK_TOKEN
    # is configured in this repository's GitHub Actions secrets.
    # schedule:
    #   - cron: "5 * * * *"
permissions:
  contents: read
concurrency:
  group: factor-lab-prospective-capture
  cancel-in-progress: false
jobs:
  prospective-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify scoped MotherDuck credential exists
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::Scoped MOTHERDUCK_TOKEN GitHub Actions secret required to enable prospective captures."
            exit 1
          fi
      - name: Install pinned capture dependencies
        run: pip install -r lab/requirements.txt
      - name: Append new public-market receipt-time captures
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_live_capture.py
      - name: Create or refresh live research feature views
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_prospective_features.py
      - name: Append strictly warehouse-as-of factor vintages and research co-observations
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_warehouse_asof_grid.py

      - name: Verify latest two-venue captures reached current as-of factor grid
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_capture_grid_handoff.py
      - name: Refresh source-family warehouse inventory
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_source_family_evidence.py
      - name: Audit original provider quote publication clocks (no auto-certification)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_source_clock_gap_audit.py
      - name: Evaluate institutional release gates (never self-approve)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_release_gates.py
      - name: Append current accountable release blockers
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LAB_RESEARCH_SCOPE: internal-only
          LAB_PIPELINE_COMMIT: ${{ github.sha }}
        run: python lab/phase1_release_unblock_register.py
      - name: Publish research-only workflow status
        if: always()
        shell: bash
        run: |
          echo '### Prospective capture → as-of grid → release QA' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Institutional production risk release: **NOT AUTHORIZED**' >> "$GITHUB_STEP_SUMMARY"
          echo 'Collector success is NOT verified original-quote publication time or data rights.' >> "$GITHUB_STEP_SUMMARY"
