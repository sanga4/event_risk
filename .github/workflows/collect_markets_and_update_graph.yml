name: collect_markets_and_update_graph

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # UTC; GitHub may delay runs
  workflow_dispatch:          # manual "Run workflow" button

concurrency:
  group: graph
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # first graph build fetches Wikipedia data once (can take ~1 h; progress is saved); later runs ~1 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify MotherDuck credential is configured
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::Missing MOTHERDUCK_TOKEN GitHub Actions secret. Configure a suitably scoped token before running this data job."
            exit 1
          fi
      - name: Install pinned project dependencies
        run: pip install -r requirements.txt
      - run: python collector.py
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      - run: python graph_build.py   # diff-only; records nothing when the graph is unchanged
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
